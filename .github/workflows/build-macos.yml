name: Build macOS v1.0

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Mac CPU: arm64 for Apple Silicon, x86_64 for Intel'
        type: choice
        default: arm64
        options: [arm64, x86_64]

permissions:
  contents: read

concurrency:
  group: macos-esp32-${{ github.ref }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.architecture == 'x86_64' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 90
    env:
      CI_VERSION: '1.0.0'
      MOONLIGHT_ARCH: ${{ inputs.architecture }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check version derivation and macOS event-loop setting
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/derive_version -p 'test_*.py'
          python3 -c 'import plistlib; p=plistlib.load(open("app/Info.plist", "rb")); assert p["NSApplicationUpdateCycleEnabled"] is False'

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          modules: 'qtmultimedia qtimageformats qtwebsockets'
          cache: true
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Test input routing, transport and performance stats
        run: bash scripts/test-input.sh .

      - name: Generate Chinese translations
        run: |
          set -euo pipefail
          lrelease app/languages/qml_zh_CN.ts -qm app/languages/qml_zh_CN.qm
          lrelease app/languages/qml_zh_TW.ts -qm app/languages/qml_zh_TW.qm

      - name: Install DMG tool
        run: npm install --global create-dmg@8.1.0

      - name: Build application and DMG
        run: bash scripts/generate-dmg.sh Release

      - name: Verify packaged macOS setting and record source
        run: |
          set -euo pipefail
          python3 -c 'import plistlib; p=plistlib.load(open("build/build-Release/app/Moonlight.app/Contents/Info.plist", "rb")); assert p["NSApplicationUpdateCycleEnabled"] is False'
          cp SOURCE-PROVENANCE.json build/installer-Release/
          cp scripts/diagnose-mouse-macos.sh build/installer-Release/
          cp docs/MOUSE-DIAGNOSTICS.md build/installer-Release/
          git rev-parse HEAD > build/installer-Release/SOURCE-COMMIT.txt
          cd build/installer-Release
          shasum -a 256 ./*.dmg > SHA256SUMS.txt

      - name: Upload Mac installer
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-VPlus-ESP32-v1.0-macOS-${{ inputs.architecture }}
          path: |
            build/installer-Release/*.dmg
            build/installer-Release/SHA256SUMS.txt
            build/installer-Release/SOURCE-PROVENANCE.json
            build/installer-Release/SOURCE-COMMIT.txt
            build/installer-Release/diagnose-mouse-macos.sh
            build/installer-Release/MOUSE-DIAGNOSTICS.md
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
